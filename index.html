<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Las 100 mejores series del siglo XXI</title>
<style>
  :root{
    --bg:#fdfdfb; --fg:#111; --muted:#666; --line:#ddd; --accent:#0a5c36;
    --row-hover:#f3f2ee; --chip-bg:#eee; --chip-active:#111; --chip-active-fg:#fff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15161a; --fg:#eee; --muted:#999; --line:#333;
      --row-hover:#1f2024; --chip-bg:#2a2b30; --chip-active:#eee; --chip-active-fg:#111;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15161a; --fg:#eee; --muted:#999; --line:#333;
    --row-hover:#1f2024; --chip-bg:#2a2b30; --chip-active:#eee; --chip-active-fg:#111;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:20px 16px 12px; border-bottom:2px solid var(--fg);
    position:sticky; top:0; background:var(--bg); z-index:5;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
  }
  .masthead{font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:4px;}
  h1{margin:0 0 12px; font-size:clamp(20px,5vw,30px); line-height:1.2;}
  .controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  .chip{
    border:1px solid var(--line); background:var(--chip-bg); color:var(--fg);
    padding:7px 14px; border-radius:20px; font-size:13px; cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{background:var(--chip-active); color:var(--chip-active-fg); border-color:var(--chip-active);}
  .stats{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:12px; color:var(--muted); margin-left:auto; white-space:nowrap;}
  .search{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:14px; padding:7px 12px; border-radius:20px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); flex:1 1 140px; min-width:100px;
  }
  main{padding:8px 16px 40px; max-width:900px; margin:0 auto;}
  .col-head{
    display:grid; grid-template-columns:1fr 60px 78px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted);
    border-bottom:1px solid var(--line); padding:10px 4px; position:sticky;
    top:calc(96px + env(safe-area-inset-top,0px)); background:var(--bg); z-index:4;
  }
  .col-head span:nth-child(2), .col-head span:nth-child(3){text-align:center;}
  ul{list-style:none; margin:0; padding:0;}
  li.row{
    display:grid; grid-template-columns:1fr 60px 78px; align-items:center;
    padding:10px 4px; border-bottom:1px solid var(--line); gap:4px;
  }
  li.row:hover{background:var(--row-hover);}
  li.row.hidden{display:none;}
  .title-cell{display:flex; gap:8px; min-width:0;}
  .num{color:var(--muted); font-size:14px; min-width:26px;}
  .name{font-size:15px; line-height:1.35;}
  .name b{font-weight:700;}
  .years{color:var(--muted); font-size:13px;}
  .check{display:flex; justify-content:center;}
  input[type=checkbox]{
    width:20px; height:20px; cursor:pointer; accent-color:var(--accent);
  }
  footer{
    text-align:center; padding:20px; font-size:12px; color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  }
  .reset-btn{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:12px; color:var(--muted); background:none; border:1px solid var(--line);
    padding:6px 12px; border-radius:20px; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <div class="masthead">The New York Times</div>
  <h1>Las 100 mejores series del siglo XXI</h1>
  <div class="controls">
    <button class="chip active" data-filter="all">Todas</button>
    <button class="chip" data-filter="seen">✅ Vistas</button>
    <button class="chip" data-filter="pending">🔖 Pendientes</button>
    <button class="chip" data-filter="unmarked">Sin marcar</button>
    <input class="search" type="text" placeholder="Buscar título…" id="searchBox">
    <span class="stats" id="stats"></span>
  </div>
</header>

<main>
  <div class="col-head">
    <span>Serie</span>
    <span>Vista</span>
    <span>Pendiente</span>
  </div>
  <ul id="list"></ul>
</main>

<footer>
  Datos guardados solo en este navegador (localStorage). ·
  <button class="reset-btn" id="resetBtn">Borrar todas mis marcas</button>
</footer>

<script>
const shows = [
["Breaking Bad","2008-2013"],["The Wire","2002-2008"],["Mad Men","2007-2015"],
["Succession","2018-2023"],["Fleabag","2016-2019"],["Game of Thrones","2011-2019"],
["Veep","2012-2019"],["30 Rock","2006-2013"],["Curb Your Enthusiasm","2000-2024"],
["Atlanta","2016-2022"],["The Office (U.S.)","2005-2013"],["Arrested Development","2003-2019"],
["Girls","2012-2017"],["Friday Night Lights","2006-2011"],["Six Feet Under","2001-2005"],
["The Office (U.K.)","2001-2003"],["The Americans","2013-2018"],["I May Destroy You","2020"],
["Chernobyl","2019"],["The Crown","2016-2023"],["The White Lotus","2021-present"],
["Lost","2004-2010"],["The Comeback","2005-2026"],["Deadwood","2004-2006"],
["The Leftovers","2014-2017"],["Black Mirror","2011-present"],["Better Call Saul","2015-2022"],
["Band of Brothers","2001"],["Key & Peele","2012-2015"],["Severance","2022-present"],
["Survivor","2000-present"],["Andor","2022-2025"],["Enlightened","2011-2013"],
["Schitt's Creek","2015-2020"],["True Detective (Season 1)","2014"],["The Pitt","2025-present"],
["Battlestar Galactica","2005-2009"],["Homeland","2011-2020"],["Watchmen","2019"],
["Adolescence","2025"],["Louie","2010-2015"],["Hacks","2021-2026"],
["Peaky Blinders","2013-2022"],["BoJack Horseman","2014-2020"],["Happy Valley","2014-2023"],
["Broad City","2014-2019"],["Twin Peaks: The Return","2017"],["House of Cards","2013-2018"],
["Normal People","2020"],["Parks and Recreation","2009-2015"],["The Good Place","2016-2020"],
["Downton Abbey","2010-2015"],["Stranger Things","2016-2025"],["The Bureau","2015-2020"],
["Insecure","2016-2021"],["Nathan for You","2013-2017"],["I Think You Should Leave","2019-present"],
["Chappelle's Show","2003-2006"],["PEN15","2019-2021"],["Peep Show","2003-2015"],
["RuPaul's Drag Race","2009-present"],["Slow Horses","2022-present"],["The Thick of It","2005-2012"],
["Anthony Bourdain: Parts Unknown","2013-2018"],["Mare of Easttown","2021"],["The Rehearsal","2022-present"],
["The Handmaid's Tale","2017-2025"],["Ozark","2017-2022"],["Anthony Bourdain: No Reservations","2005-2012"],
["The Shield","2002-2008"],["Beef (Season 1)","2023"],["Squid Game","2021-2025"],
["Barry","2018-2023"],["The Bear","2022-2026"],["Ted Lasso","2020-present"],
["Somebody Somewhere","2022-2024"],["Modern Family","2009-2020"],["It's Always Sunny in Philadelphia","2005-present"],
["The Good Wife","2009-2016"],["How To With John Wilson","2020-2023"],["The Queen's Gambit","2020"],
["Better Things","2016-2022"],["Justified","2010-2015"],["Planet Earth","2006"],
["The Great British Baking Show","2010-present"],["Shogun","2024-present"],["Reservation Dogs","2021-2023"],
["Dexter","2006-2013"],["Baby Reindeer","2024"],["Eastbound & Down","2009-2013"],
["Catastrophe","2015-2019"],["The Night Of","2016"],["Station Eleven","2021-2022"],
["The Diplomat","2023-present"],["House","2004-2012"],["Halt and Catch Fire","2014-2017"],
["Community","2009-2015"],["The OA","2016-2019"],["Gilmore Girls","2000-2007"],
["Scandal","2012-2018"]
];

const STORAGE_KEY = 'nyt100_series_estado_v1';
let state = {};
try{
  state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
}catch(e){ state = {}; }

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('No se pudo guardar', e); }
}

const list = document.getElementById('list');
const statsEl = document.getElementById('stats');
let currentFilter = 'all';
let searchTerm = '';

function render(){
  list.innerHTML = '';
  let seenCount = 0, pendingCount = 0;

  shows.forEach((show, i)=>{
    const id = 'show_' + i;
    const [name, years] = show;
    const st = state[id] || {seen:false, pending:false};
    if(st.seen) seenCount++;
    if(st.pending) pendingCount++;

    const matchesFilter =
      currentFilter === 'all' ||
      (currentFilter === 'seen' && st.seen) ||
      (currentFilter === 'pending' && st.pending) ||
      (currentFilter === 'unmarked' && !st.seen && !st.pending);

    const matchesSearch = name.toLowerCase().includes(searchTerm);

    const li = document.createElement('li');
    li.className = 'row' + ((matchesFilter && matchesSearch) ? '' : ' hidden');

    li.innerHTML = `
      <div class="title-cell">
        <span class="num">${i+1}.</span>
        <span class="name"><b>${name}</b> <span class="years">(${years})</span></span>
      </div>
      <div class="check"><input type="checkbox" data-id="${id}" data-kind="seen" ${st.seen?'checked':''}></div>
      <div class="check"><input type="checkbox" data-id="${id}" data-kind="pending" ${st.pending?'checked':''}></div>
    `;
    list.appendChild(li);
  });

  statsEl.textContent = `Vistas: ${seenCount} · Pendientes: ${pendingCount} · Total: ${shows.length}`;
}

list.addEventListener('change', (e)=>{
  const input = e.target;
  if(input.tagName !== 'INPUT') return;
  const id = input.dataset.id;
  const kind = input.dataset.kind;
  if(!state[id]) state[id] = {seen:false, pending:false};
  state[id][kind] = input.checked;
  // si marcas "vista" quitamos "pendiente" automáticamente, y viceversa
  if(kind === 'seen' && input.checked) state[id].pending = false;
  if(kind === 'pending' && input.checked) state[id].seen = false;
  save();
  render();
});

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    render();
  });
});

document.getElementById('searchBox').addEventListener('input', (e)=>{
  searchTerm = e.target.value.toLowerCase();
  render();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('¿Borrar todas tus marcas de esta lista? Esta acción no se puede deshacer.')){
    state = {};
    save();
    render();
  }
});

render();
</script>
</body>
</html>
